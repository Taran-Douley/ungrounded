[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ungrounded"
version = "0.2.2"
description = "Measure how often your LLM agent reaches for the wrong tool when it cannot ground an entity in a request."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Taran Douley" }]
keywords = ["llm", "agents", "tool-use", "function-calling", "evaluation", "reliability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.40", "openai>=1.40"]

[project.scripts]
ungrounded = "ungrounded.cli:_entry"

[project.urls]
Homepage = "https://github.com/ShroudLabs/ungrounded-agents"
Paper = "https://doi.org/10.5281/zenodo.21958705"

[tool.hatch.build.targets.wheel]
packages = ["src/ungrounded"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "reference/", "README.md", "LICENSE", "pyproject.toml"]
